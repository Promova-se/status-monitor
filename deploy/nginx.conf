# Nginx: proxy reverso para o Status.
# Troque status.seudominio.com pelo seu subdominio.
# Salve como /etc/nginx/sites-available/status e crie o symlink em sites-enabled.
# O bloco HTTPS (443) e preenchido automaticamente pelo certbot.

server {
    listen 80;
    server_name status.seudominio.com;

    # Repassa o IP real do visitante para o app (usado no rate-limit/login).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
